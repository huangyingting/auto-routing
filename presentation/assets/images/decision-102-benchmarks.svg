<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <style>
    text { font-family: 'Inter Tight', 'Segoe UI Variable Text', 'Segoe UI', Arial, sans-serif; }
    .mono { font-family: 'Inconsolata', 'Cascadia Mono', Consolas, monospace; }
  </style>

  <!-- Card background -->
  <rect width="1400" height="1000" rx="18" fill="#FFFFFF"/>

  <!-- Header -->
  <rect x="48" y="34" width="136" height="28" rx="6" fill="#23221F"/>
  <text x="116" y="53" text-anchor="middle" font-size="14" font-weight="700" letter-spacing="1.2" fill="#FFFFFF" class="mono">102 BENCHMARKS</text>
  <text x="200" y="54" font-size="17" font-weight="600" fill="#57534C">385,246 blind questions  ·  41 public + 61 internal  ·  Higher is better</text>

  <text x="48" y="102" font-size="34" font-weight="800" fill="#1E242B">Average Accuracy Across 102 Decision Benchmarks</text>

  <!-- Legend -->
  <g transform="translate(48, 126)">
    <rect x="0" y="2" width="18" height="18" rx="4" fill="#3F607E"/>
    <text x="26" y="17" font-size="17" font-weight="700" fill="#1E242B">Microsoft-Decision-1.1 (#1 overall · 123 ms)</text>

    <rect x="430" y="2" width="18" height="18" rx="4" fill="#DCE6EF" stroke="#3F607E" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="456" y="17" font-size="17" font-weight="600" fill="#4E5965">Microsoft-Decision-1 (prev. release · 274 ms)</text>

    <rect x="866" y="2" width="18" height="18" rx="4" fill="#D5CFC3"/>
    <text x="892" y="17" font-size="17" fill="#57534C">Other specialized &amp; frontier decision models</text>
  </g>

  <!-- Plot grid: x from 380 to 1260 (width = 880 px for range 58% -> 82%, i.e. 24 pts => 36.667 px/pt) -->
  <g id="grid" stroke="#EAE4D8" stroke-width="1.5">
    <!-- 60%: 380 + (2/24)*880 = 453.3 -->
    <line x1="453.3" y1="168" x2="453.3" y2="612"/>
    <!-- 65%: 380 + (7/24)*880 = 636.7 -->
    <line x1="636.7" y1="168" x2="636.7" y2="612"/>
    <!-- 70%: 380 + (12/24)*880 = 820.0 -->
    <line x1="820.0" y1="168" x2="820.0" y2="612"/>
    <!-- 75%: 380 + (17/24)*880 = 1003.3 -->
    <line x1="1003.3" y1="168" x2="1003.3" y2="612"/>
    <!-- 80%: 380 + (22/24)*880 = 1186.7 -->
    <line x1="1186.7" y1="168" x2="1186.7" y2="612"/>
  </g>

  <!-- Bars (8 systems, row pitch = 54px, starting y = 176) -->
  <!-- 1: Microsoft-Decision-1.1 = 78.83% -> width = (78.83 - 58)/24 * 880 = 763.8 -->
  <g>
    <rect x="36" y="172" width="1328" height="48" rx="8" fill="#F2F6FA"/>
    <rect x="46" y="182" width="38" height="28" rx="6" fill="#3F607E"/>
    <text x="65" y="202" text-anchor="middle" font-size="15" font-weight="800" fill="#FFFFFF" class="mono">#1</text>
    <text x="364" y="203" text-anchor="end" font-size="20" font-weight="800" fill="#1E242B">Microsoft-Decision-1.1</text>
    <rect x="380" y="179" width="763.8" height="34" rx="6" fill="#3F607E"/>
    <text x="1156" y="203" font-size="21" font-weight="800" fill="#1E242B" class="mono">78.8%</text>
    <rect x="1232" y="182" width="122" height="28" rx="14" fill="#E3F1E8" stroke="#286B4B" stroke-width="1.2"/>
    <text x="1293" y="201" text-anchor="middle" font-size="14" font-weight="700" fill="#1F583D" class="mono">+2.0 pts vs v1</text>
  </g>

  <!-- 2: Jev 1.14.0 (TypeSafe) = 78.12% -> width = (78.12 - 58)/24 * 880 = 737.7 -->
  <g>
    <text x="364" y="257" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">Jev 1.14.0 <tspan fill="#8A8377" font-size="15">(TypeSafe)</tspan></text>
    <rect x="380" y="234" width="737.7" height="32" rx="5" fill="#D5CFC3"/>
    <text x="1130" y="257" font-size="19" font-weight="700" fill="#475569" class="mono">78.1%</text>
  </g>

  <!-- 3: Gemini Decision 1 (Google) = 77.73% -> width = (77.73 - 58)/24 * 880 = 723.4 -->
  <g>
    <text x="364" y="311" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">Gemini Decision 1 <tspan fill="#8A8377" font-size="15">(Google · 101/102)</tspan></text>
    <rect x="380" y="288" width="723.4" height="32" rx="5" fill="#D5CFC3"/>
    <text x="1116" y="311" font-size="19" font-weight="700" fill="#475569" class="mono">77.7%</text>
  </g>

  <!-- 4: elephant-1 (Base Labs) = 77.28% -> width = (77.28 - 58)/24 * 880 = 706.9 -->
  <g>
    <text x="364" y="365" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">elephant-1 <tspan fill="#8A8377" font-size="15">(Base Labs)</tspan></text>
    <rect x="380" y="342" width="706.9" height="32" rx="5" fill="#D5CFC3"/>
    <text x="1099" y="365" font-size="19" font-weight="700" fill="#475569" class="mono">77.3%</text>
  </g>

  <!-- 5: Microsoft-Decision-1 = 76.83% -> width = (76.83 - 58)/24 * 880 = 690.4 -->
  <g>
    <text x="364" y="419" text-anchor="end" font-size="18.5" font-weight="700" fill="#2F4B66">Microsoft-Decision-1 <tspan fill="#64748B" font-size="15">(v1.0)</tspan></text>
    <rect x="380" y="396" width="690.4" height="32" rx="5" fill="#DCE6EF" stroke="#3F607E" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="1083" y="419" font-size="19" font-weight="700" fill="#2F4B66" class="mono">76.8%</text>
  </g>

  <!-- 6: Clef (Cloudflare) = 75.69% -> width = (75.69 - 58)/24 * 880 = 648.6 -->
  <g>
    <text x="364" y="473" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">Clef <tspan fill="#8A8377" font-size="15">(Cloudflare)</tspan></text>
    <rect x="380" y="450" width="648.6" height="32" rx="5" fill="#D5CFC3"/>
    <text x="1041" y="473" font-size="19" font-weight="700" fill="#475569" class="mono">75.7%</text>
  </g>

  <!-- 7: GPT-6 Luna (Decisions) = 73.40% -> width = (73.40 - 58)/24 * 880 = 564.7 -->
  <g>
    <text x="364" y="527" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">GPT-6 Luna (Decisions) <tspan fill="#8A8377" font-size="15">(OpenAI)</tspan></text>
    <rect x="380" y="504" width="564.7" height="32" rx="5" fill="#D5CFC3"/>
    <text x="957" y="527" font-size="19" font-weight="700" fill="#475569" class="mono">73.4%</text>
  </g>

  <!-- 8: Strands decider 2B v1 (AWS) = 61.77% -> width = (61.77 - 58)/24 * 880 = 138.2 -->
  <g>
    <text x="364" y="581" text-anchor="end" font-size="18.5" font-weight="600" fill="#475569">Strands decider 2B v1 <tspan fill="#8A8377" font-size="15">(AWS · 101/102)</tspan></text>
    <rect x="380" y="558" width="138.2" height="32" rx="5" fill="#D5CFC3"/>
    <text x="530" y="581" font-size="19" font-weight="700" fill="#475569" class="mono">61.8%</text>
  </g>

  <!-- Axis baseline & ticks -->
  <line x1="380" y1="612" x2="1260" y2="612" stroke="#1E242B" stroke-width="1.8"/>
  <g font-size="16" fill="#57534C" text-anchor="middle" class="mono">
    <text x="453.3" y="636">60%</text>
    <text x="636.7" y="636">65%</text>
    <text x="820.0" y="636">70%</text>
    <text x="1003.3" y="636">75%</text>
    <text x="1186.7" y="636">80%</text>
  </g>
  <text x="1260" y="658" text-anchor="end" font-size="14.5" fill="#6E685F" class="mono">AVERAGE ACCURACY (AXIS STARTS AT 58%)</text>

  <!-- Divider -->
  <line x1="48" y1="684" x2="1352" y2="684" stroke="#DDD6C9" stroke-width="1.5"/>

  <!-- Bottom capability breakdown: Leads 7 of 9 capability categories -->
  <text x="48" y="722" font-size="23" font-weight="800" fill="#1E242B">Leads 7 of 9 Capability Categories  <tspan font-size="17" font-weight="500" fill="#57534C">(Decision-1.1 vs. next-best external rival across all 102 benchmarks)</tspan></text>

  <!-- 7 #1 capability cards in one clean 7-column strip (width 1304, gap 12 => card_w = (1304 - 72)/7 = 176) -->
  <g transform="translate(48, 744)">
    <!-- Col 1: Consistency -->
    <g transform="translate(0, 0)">
      <rect width="176" height="174" rx="10" fill="#F7F5F0" stroke="#C9C0AE" stroke-width="1.4"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#3F607E"/>
      <text x="41" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" class="mono">#1 / 8</text>
      <text x="14" y="64" font-size="17" font-weight="700" fill="#1E242B">Consistency</text>
      <text x="14" y="112" font-size="34" font-weight="800" fill="#3F607E" class="mono">91.8%</text>
      <text x="14" y="142" font-size="13.5" fill="#57534C">vs. Clef 90.3%</text>
      <text x="14" y="160" font-size="12.5" fill="#8A8377" class="mono">7 benchmarks</text>
    </g>

    <!-- Col 2: Tools & agents -->
    <g transform="translate(188, 0)">
      <rect width="176" height="174" rx="10" fill="#F7F5F0" stroke="#C9C0AE" stroke-width="1.4"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#3F607E"/>
      <text x="41" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" class="mono">#1 / 8</text>
      <text x="14" y="64" font-size="17" font-weight="700" fill="#1E242B">Tools &amp; agents</text>
      <text x="14" y="112" font-size="34" font-weight="800" fill="#3F607E" class="mono">86.6%</text>
      <text x="14" y="142" font-size="13.5" fill="#57534C">vs. elephant-1 85.1%</text>
      <text x="14" y="160" font-size="12.5" fill="#8A8377" class="mono">10 benchmarks</text>
    </g>

    <!-- Col 3: Safety & RAI -->
    <g transform="translate(376, 0)">
      <rect width="176" height="174" rx="10" fill="#F7F5F0" stroke="#C9C0AE" stroke-width="1.4"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#3F607E"/>
      <text x="41" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" class="mono">#1 / 8</text>
      <text x="14" y="64" font-size="17" font-weight="700" fill="#1E242B">Safety &amp; RAI</text>
      <text x="14" y="112" font-size="34" font-weight="800" fill="#3F607E" class="mono">85.6%</text>
      <text x="14" y="142" font-size="13.5" fill="#57534C">vs. Jev 1.14 84.2%</text>
      <text x="14" y="160" font-size="12.5" fill="#8A8377" class="mono">11 benchmarks</text>
    </g>

    <!-- Col 4: Routing & classif. -->
    <g transform="translate(564, 0)">
      <rect width="176" height="174" rx="10" fill="#F7F5F0" stroke="#C9C0AE" stroke-width="1.4"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#3F607E"/>
      <text x="41" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" class="mono">#1 / 8</text>
      <text x="14" y="64" font-size="17" font-weight="700" fill="#1E242B">Routing &amp; class.</text>
      <text x="14" y="112" font-size="34" font-weight="800" fill="#3F607E" class="mono">81.7%</text>
      <text x="14" y="142" font-size="13.5" fill="#57534C">vs. Gemini 81.5%</text>
      <text x="14" y="160" font-size="12.5" fill="#8A8377" class="mono">23 benchmarks</text>
    </g>

    <!-- Col 5: Reading & rules -->
    <g transform="translate(752, 0)">
      <rect width="176" height="174" rx="10" fill="#F7F5F0" stroke="#C9C0AE" stroke-width="1.4"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#3F607E"/>
      <text x="41" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" class="mono">#1 / 8</text>
      <text x="14" y="64" font-size="17" font-weight="700" fill="#1E242B">Reading &amp; rules</text>
      <text x="14" y="112" font-size="34" font-weight="800" fill="#3F607E" class="mono">79.4%</text>
      <text x="14" y="142" font-size="13.5" fill="#57534C">vs. elephant-1 79.1%</text>
      <text x="14" y="160" font-size="12.5" fill="#8A8377" class="mono">14 benchmarks</text>
    </g>

    <!-- Col 6: Reasoning -->
    <g transform="translate(940, 0)">
      <rect width="176" height="174" rx="10" fill="#F7F5F0" stroke="#C9C0AE" stroke-width="1.4"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#3F607E"/>
      <text x="41" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" class="mono">#1 / 8</text>
      <text x="14" y="64" font-size="17" font-weight="700" fill="#1E242B">Reasoning</text>
      <text x="14" y="112" font-size="34" font-weight="800" fill="#3F607E" class="mono">73.9%</text>
      <text x="14" y="142" font-size="13.5" fill="#57534C">vs. elephant-1 73.3%</text>
      <text x="14" y="160" font-size="12.5" fill="#8A8377" class="mono">12 benchmarks</text>
    </g>

    <!-- Col 7: Judging & pref. -->
    <g transform="translate(1128, 0)">
      <rect width="176" height="174" rx="10" fill="#F7F5F0" stroke="#C9C0AE" stroke-width="1.4"/>
      <rect x="14" y="14" width="54" height="24" rx="12" fill="#3F607E"/>
      <text x="41" y="31" text-anchor="middle" font-size="13" font-weight="700" fill="#FFFFFF" class="mono">#1 / 8</text>
      <text x="14" y="64" font-size="17" font-weight="700" fill="#1E242B">Judging &amp; pref.</text>
      <text x="14" y="112" font-size="34" font-weight="800" fill="#3F607E" class="mono">72.4%</text>
      <text x="14" y="142" font-size="13.5" fill="#57534C">vs. Jev 1.14 71.9%</text>
      <text x="14" y="160" font-size="12.5" fill="#8A8377" class="mono">9 benchmarks</text>
    </g>
  </g>

  <!-- Source note -->
  <text x="48" y="962" font-size="14.5" fill="#6E685F">Source: Microsoft Decision benchmark report (Nov 14, 2026) — byte-identical production API / published-weight runs across 102 benchmarks.</text>
</svg>
